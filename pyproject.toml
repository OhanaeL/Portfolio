[project]
name = "portfolio"
version = "1.0.0"
description = "A beautiful dynamic portfolio website built with Flask"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.1",
    "markdown==3.5.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

